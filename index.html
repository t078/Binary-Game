<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cisco Binary Game 經典版</title>
  <style>
    :root {
      --cyan-header: #00a8cc;
      --navy-bg: #00567a;
      --navy-dark: #003e58;
      --green-panel: #5cb85c;
      --orange-btn: #f0a500;
      --orange-border: #e67e22;
      --green-border: #27ae60;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; user-select: none; }
    body { background-color: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

    .game-container {
      display: flex; width: 100%; max-width: 850px; height: 600px;
      background: var(--navy-bg); border: 3px solid #000; border-radius: 8px; overflow: hidden;
    }

    /* 左側主要遊戲區 */
    .main-board { flex: 1; display: flex; flex-direction: column; position: relative; border-right: 3px solid #000; }

    .bit-headers {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--cyan-header); color: white; font-weight: bold; text-align: center;
      padding: 10px 12px; font-size: 0.95rem; border-bottom: 2px solid #000;
    }

    .bit-header-box { flex: 1; text-align: center; }
    .bit-header-spacer { width: 100px; } /* 留給右側等號與數字框的空間 */

    .row-container {
      flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
      padding-bottom: 5px; background: var(--navy-dark); overflow: hidden; position: relative;
    }

    /* 每一行題目列 (使用 flex 並禁止換行) */
    .game-row {
      display: flex; align-items: center; flex-wrap: nowrap;
      padding: 4px 12px; margin-top: 4px; gap: 6px; width: 100%;
    }

    /* 8個位元的區域 */
    .bits-wrapper {
      display: flex; flex: 1; gap: 4px;
    }

    /* 方塊樣式 */
    .bit-tile {
      flex: 1; height: 42px; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.1s;
    }

    /* 10轉2 題目 (橘框) */
    .row-type-10to2 .bit-tile {
      background: #003e58; border: 2px solid var(--orange-btn); color: var(--orange-btn);
    }
    .row-type-10to2 .bit-tile.active {
      background: var(--orange-btn); color: #000;
    }

    /* 2轉10 題目 (綠框) */
    .row-type-2to10 .bit-tile {
      background: #003e58; border: 2px solid var(--green-panel); color: var(--green-panel); cursor: default;
    }

    .equal-sign {
      color: var(--cyan-header); font-size: 1.5rem; font-weight: bold;
      width: 25px; text-align: center; flex-shrink: 0;
    }

    /* 右側結果輸入/顯示框 */
    .val-box {
      width: 65px; height: 40px; background: white; border-radius: 6px;
      font-size: 1.3rem; font-weight: bold; display: flex; align-items: center;
      justify-content: center; color: #000; flex-shrink: 0;
    }

    .val-input {
      width: 100%; height: 100%; border: none; text-align: center; font-size: 1.3rem;
      font-weight: bold; outline: none; background: transparent; color: #000;
      user-select: text;
    }

    .target-orange { background: var(--orange-btn); color: #000; font-size: 1.4rem; font-weight: bold; }

    /* 右側控制面板 */
    .side-panel {
      width: 220px; background: var(--navy-bg); display: flex; flex-direction: column;
      padding: 10px; gap: 10px;
    }

    .stat-card {
      background: var(--green-panel); color: white; border-radius: 6px;
      padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
      font-weight: bold; font-size: 0.9rem; border: 2px solid #3d8b3d;
    }

    .stat-card span.value { font-size: 1.3rem; }
    .control-spacer { flex: 1; }

    .btn-side {
      background: var(--orange-btn); color: #000; border: none; padding: 12px;
      font-weight: bold; border-radius: 6px; font-size: 0.95rem; cursor: pointer; text-align: center;
    }
    .btn-side:hover { filter: brightness(1.1); }

    /* Modal 彈窗 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--navy-bg); border: 3px solid var(--cyan-header); border-radius: 10px;
      padding: 25px; width: 90%; max-width: 400px; color: white; text-align: center;
    }
    .modal h2 { margin-bottom: 15px; color: var(--cyan-header); }
    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #ccc; }
    .input-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; user-select: text; }
    .btn-modal { width: 100%; padding: 10px; background: var(--green-panel); color: white; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- 左側遊戲主板 -->
    <div class="main-board">
      <div class="bit-headers">
        <div class="bit-header-box">128</div><div class="bit-header-box">64</div>
        <div class="bit-header-box">32</div><div class="bit-header-box">16</div>
        <div class="bit-header-box">8</div><div class="bit-header-box">4</div>
        <div class="bit-header-box">2</div><div class="bit-header-box">1</div>
        <div class="bit-header-spacer"></div>
      </div>

      <div class="row-container" id="row-container">
        <!-- 題目列由 JS 動態生成 -->
      </div>

      <div class="bit-headers" style="border-top: 2px solid #000; border-bottom: none;">
        <div class="bit-header-box">128</div><div class="bit-header-box">64</div>
        <div class="bit-header-box">32</div><div class="bit-header-box">16</div>
        <div class="bit-header-box">8</div><div class="bit-header-box">4</div>
        <div class="bit-header-box">2</div><div class="bit-header-box">1</div>
        <div class="bit-header-spacer"></div>
      </div>
    </div>

    <!-- 右側資訊與控制列 -->
    <div class="side-panel">
      <div class="stat-card">
        <span>SCORE</span><span class="value" id="score-val">0</span>
      </div>
      <div class="stat-card">
        <span>LEVEL</span><span class="value" id="level-val">1</span>
      </div>
      <div class="stat-card">
        <span>LINES LEFT</span><span class="value" id="lines-val">15</span>
      </div>

      <div class="control-spacer"></div>

      <button class="btn-side" id="pause-btn">PAUSE</button>
      <button class="btn-side" id="end-btn">END GAME</button>
    </div>
  </div>

  <!-- 彈窗 1：登入資訊 -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <h2>二進位挑戰賽 - 身份登記</h2>
      <div class="input-group"><label>班級 (例: 801)</label><input type="text" id="input-class"></div>
      <div class="input-group"><label>座號 (例: 05)</label><input type="number" id="input-seat"></div>
      <div class="input-group"><label>姓名</label><input type="text" id="input-name"></div>
      <button class="btn-modal" id="start-btn">開始遊戲</button>
    </div>
  </div>

  <!-- 彈窗 2：結算畫面 -->
  <div class="modal-overlay" id="gameover-modal">
    <div class="modal">
      <h2>遊戲結束！</h2>
      <p style="margin: 10px 0;">得分: <strong id="final-score">0</strong> | 最高關卡: <strong id="final-level">1</strong></p>
      <button class="btn-modal" id="submit-btn">上傳成績至 Google 試算表</button>
      <button class="btn-modal" id="view-board-btn" style="background:var(--cyan-header);">🏆 查看即時排行榜</button>
      <button class="btn-modal" id="restart-btn" style="background:#888;">重新開始</button>
      <div id="status-msg" style="margin-top:10px; font-size:0.85rem;"></div>
    </div>
  </div>

  <!-- 彈窗 3：排行榜 -->
  <div class="modal-overlay" id="leaderboard-modal">
    <div class="modal" style="max-width: 450px;">
      <h2>🏆 課堂即時排行榜 (Top 10)</h2>
      <div style="max-height: 250px; overflow-y: auto;">
        <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
          <thead>
            <tr style="background:#003e58; color:white;"><th>名次</th><th>學生</th><th>關卡</th><th>得分</th></tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
      <button class="btn-modal" id="close-board-btn">關閉</button>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPQfus6Wo0Wi5JDRzkQf-ThjmM8IFU-_q_24gOqKH3zRFOmZJimhPjzgniHEwwWoZYvw/exec";

    const BIT_VALS = [128, 64, 32, 16, 8, 4, 2, 1];
    let score = 0, level = 1, linesLeft = 15;
    let rowsData = [];
    let isPaused = false, isGameOver = false;
    let spawnTimer = null;
    let studentInfo = {};

    const rowContainer = document.getElementById('row-container');
    const authModal = document.getElementById('auth-modal');
    const gameoverModal = document.getElementById('gameover-modal');
    const leaderboardModal = document.getElementById('leaderboard-modal');

    window.onload = () => authModal.classList.add('active');

    document.getElementById('start-btn').onclick = () => {
      const cls = document.getElementById('input-class').value.trim();
      const seat = document.getElementById('input-seat').value.trim();
      const name = document.getElementById('input-name').value.trim();
      if (!cls || !seat || !name) return alert("請完整填寫身份資訊！");
      studentInfo = { className: cls, seat, name };
      authModal.classList.remove('active');
      startGame();
    };

    function startGame() {
      score = 0; level = 1; linesLeft = 15;
      rowsData = []; isPaused = false; isGameOver = false;
      document.getElementById('score-val').innerText = score;
      document.getElementById('level-val').innerText = level;
      document.getElementById('lines-val').innerText = linesLeft;
      rowContainer.innerHTML = '';
      
      gameoverModal.classList.remove('active');
      spawnRow();
      resetInterval();
    }

    function resetInterval() {
      clearInterval(spawnTimer);
      const speed = Math.max(2500, 6500 - level * 500);
      spawnTimer = setInterval(() => {
        if (!isPaused && !isGameOver) spawnRow();
      }, speed);
    }

    function spawnRow() {
      if (rowsData.length >= 8) {
        endGame();
        return;
      }

      const type = Math.random() > 0.5 ? '10to2' : '2to10';
      const targetVal = Math.floor(Math.random() * 255) + 1;
      
      const rowObj = {
        id: Date.now() + Math.random(),
        type: type,
        targetVal: targetVal,
        bits: type === '2to10' ? valToBits(targetVal) : [0,0,0,0,0,0,0,0],
        inputVal: ''
      };

      rowsData.unshift(rowObj);
      renderRows();
    }

    function valToBits(val) {
      let res = [];
      for (let i = 0; i < 8; i++) {
        res.push((val & BIT_VALS[i]) ? 1 : 0);
      }
      return res;
    }

    function renderRows() {
      rowContainer.innerHTML = '';
      rowsData.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = `game-row row-type-${row.type}`;

        // 位元包裝容器
        const bitsWrapper = document.createElement('div');
        bitsWrapper.className = 'bits-wrapper';

        // 8 Bits 區塊
        for (let i = 0; i < 8; i++) {
          const tile = document.createElement('div');
          tile.className = `bit-tile ${row.bits[i] === 1 ? 'active' : ''}`;
          tile.innerText = row.bits[i];

          if (row.type === '10to2') {
            tile.onclick = () => {
              row.bits[i] = row.bits[i] === 0 ? 1 : 0;
              checkRow(row);
            };
          }
          bitsWrapper.appendChild(tile);
        }
        rowDiv.appendChild(bitsWrapper);

        // 等號
        const eq = document.createElement('div');
        eq.className = 'equal-sign';
        eq.innerText = '=';
        rowDiv.appendChild(eq);

        // 右側數值框
        const valContainer = document.createElement('div');
        if (row.type === '10to2') {
          valContainer.className = 'val-box target-orange';
          valContainer.innerText = row.targetVal;
        } else {
          valContainer.className = 'val-box';
          const input = document.createElement('input');
          input.className = 'val-input';
          input.type = 'number';
          input.value = row.inputVal;
          input.placeholder = '?';
          
          // 改變狀態但不出發消除
          input.oninput = (e) => { row.inputVal = e.target.value; };

          // 按下 Enter 鍵時才送出回答
          input.onkeydown = (e) => {
            if (e.key === 'Enter') {
              checkRow(row);
            }
          };
          valContainer.appendChild(input);
        }
        rowDiv.appendChild(valContainer);

        rowContainer.appendChild(rowDiv);
      });
    }

    function checkRow(row) {
      let isCorrect = false;

      if (row.type === '10to2') {
        const currentSum = row.bits.reduce((sum, b, i) => sum + b * BIT_VALS[i], 0);
        if (currentSum === row.targetVal) isCorrect = true;
      } else {
        if (parseInt(row.inputVal) === row.targetVal) isCorrect = true;
      }

      if (isCorrect) {
        // 答對消除該行
        rowsData = rowsData.filter(r => r.id !== row.id);
        score += 100 * level;
        linesLeft--;
        
        if (linesLeft <= 0) {
          level++;
          linesLeft = 15;
          resetInterval();
        }

        document.getElementById('score-val').innerText = score;
        document.getElementById('level-val').innerText = level;
        document.getElementById('lines-val').innerText = linesLeft;

        renderRows();
      } else {
        // 若點擊點選型 10to2，則刷新畫面更新 active 顏色；輸入型若錯則不重新 render DOM 以避免跳離
        if (row.type === '10to2') {
          renderRows();
        }
      }
    }

    document.getElementById('pause-btn').onclick = () => {
      isPaused = !isPaused;
      document.getElementById('pause-btn').innerText = isPaused ? 'RESUME' : 'PAUSE';
    };

    document.getElementById('end-btn').onclick = () => endGame();

    function endGame() {
      isGameOver = true;
      clearInterval(spawnTimer);
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-level').innerText = level;
      gameoverModal.classList.add('active');
    }

    // 上傳與排行榜機制
    document.getElementById('submit-btn').onclick = () => {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return alert("請先設定 GAS URL！");
      
      const formData = new URLSearchParams();
      formData.append('className', studentInfo.className);
      formData.append('seat', studentInfo.seat);
      formData.append('name', studentInfo.name);
      formData.append('score', score);
      formData.append('level', level);

      fetch(GAS_WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: formData.toString() })
      .then(() => {
        document.getElementById('status-msg').style.color = "lightgreen";
        document.getElementById('status-msg').innerText = "✅ 成績提交成功！";
      });
    };

    document.getElementById('view-board-btn').onclick = () => {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '<tr><td colspan="4">載入中...</td></tr>';
      leaderboardModal.classList.add('active');

      fetch(GAS_WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          tbody.innerHTML = data.map((item, idx) => `
            <tr>
              <td>${idx + 1}</td>
              <td>${item.className}${item.seat} ${item.name}</td>
              <td>L${item.level}</td>
              <td><strong>${item.score}</strong></td>
            </tr>
          `).join('');
        });
    };

    document.getElementById('close-board-btn').onclick = () => leaderboardModal.classList.remove('active');
    document.getElementById('restart-btn').onclick = () => startGame();
  </script>
</body>
</html>
