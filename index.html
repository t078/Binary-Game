<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>二進位轉換挑戰賽 Binary Game</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-light: #f8fafc;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-orange: #f97316;
      --bit-off: #334155;
      --bit-on: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: var(--card-bg);
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent-blue);
    }

    .stats-bar {
      display: flex;
      gap: 15px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-green);
    }

    .user-info-bar {
      display: flex;
      justify-content: space-between;
      background: #334155;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    /* 遊戲主要區域 */
    .game-area {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    .timer-container {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: var(--accent-green);
      transition: width 0.1s linear, background-color 0.3s;
    }

    /* 8 Bits 欄位 */
    .bits-row {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }

    .bit-header {
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .bit-btn {
      background: var(--bit-off);
      color: white;
      border: 2px solid #475569;
      aspect-ratio: 1;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
    }

    .bit-btn.active {
      background: var(--bit-on);
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* 目標值與計算展示 */
    .target-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }

    .target-text {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .target-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-orange);
    }

    .current-sum {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-light);
    }

    /* Modal 彈窗通用 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #475569;
    }

    .modal h2 { margin-bottom: 15px; color: var(--accent-blue); }
    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #94a3b8; }
    .input-group input { 
      width: 100%; padding: 10px; border: 1px solid #475569; 
      border-radius: 6px; background: #0f172a; color: white; font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-blue);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn:hover { background: #7dd3fc; }
    .btn-secondary { background: #475569; color: white; }
    .btn-secondary:hover { background: #64748b; }
    .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .result-info {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
    }

    .result-item span { display: block; font-size: 0.8rem; color: #94a3b8; }
    .result-item strong { font-size: 1.4rem; color: var(--accent-green); }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    .leaderboard-table th, .leaderboard-table td {
      padding: 8px 6px;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    .leaderboard-table th { background: #0f172a; color: var(--accent-blue); }
    .status-msg { margin-top: 8px; font-size: 0.85rem; min-height: 1.2rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Binary Game</h1>
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-label">關卡 Level</div>
          <div class="stat-value" id="level-val">1</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">得分 Score</div>
          <div class="stat-value" id="score-val">0</div>
        </div>
      </div>
    </header>

    <div class="user-info-bar">
      <span id="display-class">班級: -</span>
      <span id="display-seat">座號: -</span>
      <span id="display-name">姓名: -</span>
    </div>

    <div class="game-area">
      <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
      </div>

      <!-- 8個 Bits 位元開關 -->
      <div class="bits-row">
        <div><div class="bit-header">128</div><button class="bit-btn" data-idx="7">0</button></div>
        <div><div class="bit-header">64</div><button class="bit-btn" data-idx="6">0</button></div>
        <div><div class="bit-header">32</div><button class="bit-btn" data-idx="5">0</button></div>
        <div><div class="bit-header">16</div><button class="bit-btn" data-idx="4">0</button></div>
        <div><div class="bit-header">8</div><button class="bit-btn" data-idx="3">0</button></div>
        <div><div class="bit-header">4</div><button class="bit-btn" data-idx="2">0</button></div>
        <div><div class="bit-header">2</div><button class="bit-btn" data-idx="1">0</button></div>
        <div><div class="bit-header">1</div><button class="bit-btn" data-idx="0">0</button></div>
      </div>

      <div class="target-box">
        <div>
          <div class="target-text">請湊出目標十進位數字：</div>
          <div class="target-number" id="target-val">0</div>
        </div>
        <div>
          <div class="target-text" style="text-align: right;">目前加總：</div>
          <div class="current-sum" id="current-sum">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 彈窗 1：身份驗證 -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <h2>二進位挑戰賽 - 身份登記</h2>
      <div class="input-group">
        <label>班級 (例: 801)</label>
        <input type="text" id="input-class" placeholder="請輸入班級">
      </div>
      <div class="input-group">
        <label>座號 (例: 05)</label>
        <input type="number" id="input-seat" placeholder="請輸入座號">
      </div>
      <div class="input-group">
        <label>姓名</label>
        <input type="text" id="input-name" placeholder="請輸入姓名">
      </div>
      <button class="btn" id="start-btn">開始遊戲</button>
    </div>
  </div>

  <!-- 彈窗 2：遊戲結束與結算 -->
  <div class="modal-overlay" id="gameover-modal">
    <div class="modal">
      <h2>遊戲結束 Game Over</h2>
      <div class="result-info">
        <div class="result-item">
          <span>最高得分</span>
          <strong id="final-score">0</strong>
        </div>
        <div class="result-item">
          <span>最高關卡</span>
          <strong id="final-level">1</strong>
        </div>
      </div>
      
      <button class="btn" id="submit-btn">上傳成績至 Google 試算表</button>
      <button class="btn btn-secondary" id="view-board-btn">🏆 查看即時排行榜</button>
      <button class="btn" id="restart-btn" style="background:#64748b; color:white;">重新開始</button>
      <div class="status-msg" id="status-msg"></div>
    </div>
  </div>

  <!-- 彈窗 3：排行榜 -->
  <div class="modal-overlay" id="leaderboard-modal">
    <div class="modal" style="max-width: 450px;">
      <h2>🏆 課堂即時排行榜 (Top 10)</h2>
      <div style="max-height: 250px; overflow-y: auto;">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>名次</th>
              <th>學生</th>
              <th>最高關卡</th>
              <th>得分</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr><td colspan="4">載入中...</td></tr>
          </tbody>
        </table>
      </div>
      <button class="btn" id="close-board-btn" style="margin-top: 15px;">關閉排行榜</button>
    </div>
  </div>

  <script>
    // ⚠️ 請填入你的 Google Apps Script Web App URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPQfus6Wo0Wi5JDRzkQf-ThjmM8IFU-_q_24gOqKH3zRFOmZJimhPjzgniHEwwWoZYvw/exec";

    const BIT_VALUES = [1, 2, 4, 8, 16, 32, 64, 128];
    let bits = [0, 0, 0, 0, 0, 0, 0, 0];
    let targetValue = 0;
    let score = 0;
    let level = 1;
    let studentInfo = { className: '', seat: '', name: '' };
    let hasSubmitted = false;

    // 時間計時器
    let timerInterval = null;
    let timeLeft = 100; // 100%
    let timeSpeed = 0.2; // 隨關卡加快

    const levelEl = document.getElementById('level-val');
    const scoreEl = document.getElementById('score-val');
    const targetEl = document.getElementById('target-val');
    const sumEl = document.getElementById('current-sum');
    const timerBar = document.getElementById('timer-bar');
    
    const authModal = document.getElementById('auth-modal');
    const gameoverModal = document.getElementById('gameover-modal');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');

    const bitBtns = document.querySelectorAll('.bit-btn');

    window.onload = () => {
      authModal.classList.add('active');
    };

    // 綁定按鈕點擊
    bitBtns.forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.getAttribute('data-idx'));
        bits[idx] = bits[idx] === 0 ? 1 : 0;
        btn.innerText = bits[idx];
        btn.classList.toggle('active', bits[idx] === 1);
        checkAnswer();
      };
    });

    document.getElementById('start-btn').onclick = () => {
      const cls = document.getElementById('input-class').value.trim();
      const seat = document.getElementById('input-seat').value.trim();
      const name = document.getElementById('input-name').value.trim();

      if (!cls || !seat || !name) {
        alert("請完整填寫班級、座號與姓名！");
        return;
      }

      studentInfo = { className: cls, seat, name };
      document.getElementById('display-class').innerText = `班級: ${cls}`;
      document.getElementById('display-seat').innerText = `座號: ${seat}`;
      document.getElementById('display-name').innerText = `姓名: ${name}`;

      authModal.classList.remove('active');
      restartGame();
    };

    function restartGame() {
      score = 0;
      level = 1;
      hasSubmitted = false;
      scoreEl.innerText = score;
      levelEl.innerText = level;
      statusMsg.innerText = '';
      submitBtn.disabled = false;
      submitBtn.innerText = "上傳成績至 Google 試算表";
      gameoverModal.classList.remove('active');
      
      nextQuestion();
    }

    function nextQuestion() {
      // 歸零按鈕狀態
      bits = [0, 0, 0, 0, 0, 0, 0, 0];
      bitBtns.forEach(btn => {
        btn.innerText = '0';
        btn.classList.remove('active');
      });

      // 根據關卡產生目標數字 (最大 255)
      const maxVal = Math.min(15 + level * 20, 255);
      targetValue = Math.floor(Math.random() * maxVal) + 1;
      targetEl.innerText = targetValue;

      updateSum();
      resetTimer();
    }

    function updateSum() {
      let currentSum = 0;
      for (let i = 0; i < 8; i++) {
        if (bits[i] === 1) currentSum += BIT_VALUES[i];
      }
      sumEl.innerText = currentSum;
      return currentSum;
    }

    function checkAnswer() {
      const currentSum = updateSum();
      if (currentSum === targetValue) {
        // 答對加分並過關
        score += 100 + level * 10;
        scoreEl.innerText = score;
        
        if (score >= level * 300) {
          level++;
          levelEl.innerText = level;
        }

        nextQuestion();
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timeLeft = 100;
      // 關卡越高倒數越快
      timeSpeed = 0.2 + (level * 0.05);

      timerInterval = setInterval(() => {
        timeLeft -= timeSpeed;
        if (timeLeft <= 0) {
          timeLeft = 0;
          gameOver();
        }
        timerBar.style.width = `${timeLeft}%`;
        
        if (timeLeft < 30) {
          timerBar.style.backgroundColor = '#ef4444'; // 紅色警示
        } else {
          timerBar.style.backgroundColor = 'var(--accent-green)';
        }
      }, 50);
    }

    function gameOver() {
      clearInterval(timerInterval);
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-level').innerText = level;
      gameoverModal.classList.add('active');
    }

    // 成績上傳至 Apps Script
    submitBtn.onclick = () => {
      if (hasSubmitted) return;

      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        alert("請先在程式碼中填入有效的 Google Apps Script API 網址！");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "傳送中...";
      statusMsg.style.color = "#94a3b8";
      statusMsg.innerText = "連線中，請稍候...";

      const formData = new URLSearchParams();
      formData.append('className', studentInfo.className);
      formData.append('seat', studentInfo.seat);
      formData.append('name', studentInfo.name);
      formData.append('score', score);
      formData.append('level', level);
      formData.append('timestamp', new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }));

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      })
      .then(() => {
        hasSubmitted = true;
        statusMsg.style.color = "#22c55e";
        statusMsg.innerText = "✅ 成績上傳成功！";
        submitBtn.innerText = "已完成提交";
      })
      .catch((err) => {
        submitBtn.disabled = false;
        submitBtn.innerText = "重新提交";
        statusMsg.style.color = "#ef4444";
        statusMsg.innerText = "❌ 提交失敗，請檢查網路。";
      });
    };

    // 讀取與顯示排行榜
    document.getElementById('view-board-btn').onclick = () => {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '<tr><td colspan="4">載入排行榜中...</td></tr>';
      leaderboardModal.classList.add('active');

      fetch(GAS_WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">目前尚無成績紀錄</td></tr>';
            return;
          }
          tbody.innerHTML = data.map((item, index) => `
            <tr>
              <td>${index + 1}</td>
              <td>${item.className}${item.seat} ${item.name}</td>
              <td>Level ${item.level}</td>
              <td><strong>${item.score}</strong></td>
            </tr>
          `).join('');
        })
        .catch(err => {
          tbody.innerHTML = '<tr><td colspan="4" style="color:#ef4444;">載入排行榜失敗</td></tr>';
        });
    };

    document.getElementById('close-board-btn').onclick = () => {
      leaderboardModal.classList.remove('active');
    };

    document.getElementById('restart-btn').onclick = () => restartGame();
  </script>
</body>
</html>
