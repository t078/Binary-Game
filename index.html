<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cisco Binary Game 高效能無限挑戰版</title>
  <style>
    :root {
      --cyan-header: #00a8cc;
      --navy-bg: #00567a;
      --navy-dark: #003e58;
      --green-panel: #5cb85c;
      --orange-btn: #f0a500;
      --green-tile: #27ae60;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; user-select: none; }
    body { background-color: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

    .game-container {
      display: flex; width: 100%; max-width: 850px; height: 680px;
      background: var(--navy-bg); border: 3px solid #000; border-radius: 8px; overflow: hidden;
    }

    .main-board { flex: 1; display: flex; flex-direction: column; position: relative; border-right: 3px solid #000; }

    .bit-headers {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--cyan-header); color: white; font-weight: bold; text-align: center;
      padding: 10px 12px; font-size: 0.95rem; border-bottom: 2px solid #000;
    }

    .bit-header-box { flex: 1; text-align: center; }
    .bit-header-spacer { width: 100px; }

    .row-container {
      flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
      padding: 5px 0; background: var(--navy-dark); overflow: hidden; position: relative;
    }

    .game-row {
      display: flex; align-items: center; flex-wrap: nowrap;
      padding: 4px 12px; height: 72px; gap: 6px; width: 100%;
      will-change: transform;
    }

    .bits-wrapper { display: flex; flex: 1; gap: 4px; }

    .bit-tile {
      flex: 1; height: 48px; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: bold; border-radius: 4px; transition: background-color 0.05s ease;
    }

    .row-type-10to2 .bit-tile {
      background: #003e58; border: 2px solid var(--orange-btn); color: var(--orange-btn); cursor: pointer;
    }
    .row-type-10to2 .bit-tile.active {
      background: var(--orange-btn); color: #000;
    }

    .row-type-2to10 .bit-tile {
      background: #003e58; border: 2px solid var(--green-tile); color: var(--green-tile); cursor: default;
    }

    .equal-sign {
      color: var(--cyan-header); font-size: 1.5rem; font-weight: bold;
      width: 25px; text-align: center; flex-shrink: 0;
    }

    .val-box {
      width: 65px; height: 44px; background: white; border-radius: 6px;
      font-size: 1.3rem; font-weight: bold; display: flex; align-items: center;
      justify-content: center; color: #000; flex-shrink: 0; overflow: hidden;
    }

    .target-box { background: #fff; color: #000; border: 2px solid var(--orange-btn); }

    .val-input {
      width: 100%; height: 100%; border: none; text-align: center; font-size: 1.3rem;
      font-weight: bold; outline: none; background: transparent; color: #000;
      user-select: text;
    }

    .board-clear-banner {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(240, 165, 0, 0.95); color: #000; font-size: 2.2rem; font-weight: 900;
      padding: 15px 30px; border-radius: 10px; border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.8); pointer-events: none;
      animation: popup 0.5s ease-out forwards; z-index: 10;
    }

    @keyframes popup {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .side-panel {
      width: 220px; background: var(--navy-bg); display: flex; flex-direction: column;
      padding: 10px; gap: 10px;
    }

    .stat-card {
      background: var(--green-panel); color: white; border-radius: 6px;
      padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
      font-weight: bold; font-size: 0.9rem; border: 2px solid #3d8b3d;
    }

    .stat-card span.value { font-size: 1.3rem; }
    .control-spacer { flex: 1; }

    .btn-side {
      background: var(--orange-btn); color: #000; border: none; padding: 12px;
      font-weight: bold; border-radius: 6px; font-size: 0.95rem; cursor: pointer; text-align: center;
    }
    .btn-side:hover { filter: brightness(1.1); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--navy-bg); border: 3px solid var(--cyan-header); border-radius: 10px;
      padding: 25px; width: 90%; max-width: 400px; color: white; text-align: center;
    }
    .modal h2 { margin-bottom: 15px; color: var(--cyan-header); }
    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #ccc; }
    .input-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; user-select: text; }
    .btn-modal { width: 100%; padding: 10px; background: var(--green-panel); color: white; border: none; border-radius: 5px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="main-board">
      <div class="bit-headers">
        <div class="bit-header-box">128</div><div class="bit-header-box">64</div>
        <div class="bit-header-box">32</div><div class="bit-header-box">16</div>
        <div class="bit-header-box">8</div><div class="bit-header-box">4</div>
        <div class="bit-header-box">2</div><div class="bit-header-box">1</div>
        <div class="bit-header-spacer"></div>
      </div>

      <div class="row-container" id="row-container"></div>

      <div class="bit-headers" style="border-top: 2px solid #000; border-bottom: none;">
        <div class="bit-header-box">128</div><div class="bit-header-box">64</div>
        <div class="bit-header-box">32</div><div class="bit-header-box">16</div>
        <div class="bit-header-box">8</div><div class="bit-header-box">4</div>
        <div class="bit-header-box">2</div><div class="bit-header-box">1</div>
        <div class="bit-header-spacer"></div>
      </div>
    </div>

    <div class="side-panel">
      <div class="stat-card"><span>SCORE</span><span class="value" id="score-val">0</span></div>
      <div class="stat-card"><span>LEVEL</span><span class="value" id="level-val">1</span></div>
      <div class="stat-card"><span>LINES LEFT</span><span class="value" id="lines-val">15</span></div>
      <div class="control-spacer"></div>
      <button class="btn-side" id="pause-btn">PAUSE</button>
      <button class="btn-side" id="end-btn">END GAME</button>
    </div>
  </div>

  <!-- 彈窗 1：登入資訊 -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <h2>二進位挑戰賽 - 身份登記</h2>
      <div class="input-group"><label>班級 (例: 801)</label><input type="text" id="input-class"></div>
      <div class="input-group"><label>座號 (例: 05)</label><input type="number" id="input-seat"></div>
      <div class="input-group"><label>姓名</label><input type="text" id="input-name"></div>
      <button class="btn-modal" id="start-btn">開始遊戲</button>
    </div>
  </div>

  <!-- 彈窗 2：結算畫面 -->
  <div class="modal-overlay" id="gameover-modal">
    <div class="modal">
      <h2>GAME OVER</h2>
      <p style="margin: 10px 0;">得分: <strong id="final-score">0</strong> | 最高關卡: <strong id="final-level">1</strong></p>
      <button class="btn-modal" id="submit-btn">上傳成績至 Google 試算表</button>
      <button class="btn-modal" id="view-board-btn" style="background:var(--cyan-header);">🏆 查看即時排行榜</button>
      <button class="btn-modal" id="restart-btn" style="background:#888;">重新開始</button>
      <div id="status-msg" style="margin-top:10px; font-size:0.85rem;"></div>
    </div>
  </div>

  <!-- 彈窗 3：排行榜 -->
  <div class="modal-overlay" id="leaderboard-modal">
    <div class="modal" style="max-width: 450px;">
      <h2>🏆 課堂即時排行榜 (Top 10)</h2>
      <div style="max-height: 250px; overflow-y: auto;">
        <table style="width:100%; border-collapse:collapse; font-size:0.85rem;">
          <thead>
            <tr style="background:#003e58; color:white;"><th>名次</th><th>學生</th><th>關卡</th><th>得分</th></tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
      <button class="btn-modal" id="close-board-btn">關閉</button>
    </div>
  </div>

  <!-- 彈窗 4：暫停畫面遮罩 -->
  <div class="modal-overlay" id="pause-modal">
    <div class="modal">
      <h2>⏸️ 遊戲暫停中</h2>
      <p style="margin: 15px 0; color: #ccc;">遊戲進度與時間已完全凍結，準備好後請點擊下方按鈕繼續。</p>
      <button class="btn-modal" id="modal-resume-btn">繼續遊戲 (RESUME)</button>
    </div>
  </div>

  <script>
    // 已自動填入您的 Google Apps Script Web App URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxheewDlNgbtwV6rS7OYaaquiviDVvRoPFb3O-l0eFsDMu1JeFkX_QyTcZIlpJOdWFrdg/exec";

    const BIT_VALS = [128, 64, 32, 16, 8, 4, 2, 1];
    const MAX_ROWS = 7;

    let score = 0, level = 1, linesLeft = 15;
    let rowsData = [];
    let isPaused = false, isGameOver = false;
    let spawnTimer = null;
    let studentInfo = {};

    const rowContainer = document.getElementById('row-container');
    const authModal = document.getElementById('auth-modal');
    const gameoverModal = document.getElementById('gameover-modal');
    const leaderboardModal = document.getElementById('leaderboard-modal');
    const pauseModal = document.getElementById('pause-modal');
    const pauseBtn = document.getElementById('pause-btn');
    const modalResumeBtn = document.getElementById('modal-resume-btn');

    window.onload = () => authModal.classList.add('active');

    document.getElementById('start-btn').onclick = () => {
      const cls = document.getElementById('input-class').value.trim();
      const seat = document.getElementById('input-seat').value.trim();
      const name = document.getElementById('input-name').value.trim();
      if (!cls || !seat || !name) return alert("請完整填寫身份資訊！");
      studentInfo = { className: cls, seat, name };
      authModal.classList.remove('active');
      startGame();
    };

    function getTargetLines(lvl) { return 10 + 5 * lvl; }
    function getSpawnInterval(lvl) { return Math.max(2.0, 14.0 - 1.6 * lvl) * 1000; }

    function startGame() {
      score = 0; level = 1;
      linesLeft = getTargetLines(level);
      rowsData = []; isPaused = false; isGameOver = false;
      
      pauseBtn.innerText = 'PAUSE';
      pauseModal.classList.remove('active');

      updateUI();
      rowContainer.innerHTML = '';
      gameoverModal.classList.remove('active');

      const initRows = (level === 1) ? 4 : 3;
      for (let i = 0; i < initRows; i++) spawnRow(false);
      renderRows();
      resetInterval();
    }

    function updateUI() {
      document.getElementById('score-val').innerText = score;
      document.getElementById('level-val').innerText = level;
      document.getElementById('lines-val').innerText = linesLeft;
    }

    function resetInterval() {
      clearInterval(spawnTimer);
      spawnTimer = setInterval(() => {
        if (!isPaused && !isGameOver) {
          if (rowsData.length >= MAX_ROWS) {
            endGame();
          } else {
            spawnRow(true);
          }
        }
      }, getSpawnInterval(level));
    }

    function spawnRow(autoRender = true) {
      if (rowsData.length >= MAX_ROWS) return;

      let type = '10to2';
      const greenRatio = level >= 3 ? Math.min(0.75, 0.45 + (level - 2) * 0.05) : 0.45;
      if (Math.random() < greenRatio) type = '2to10';

      let targetVal = (level >= 4) ? Math.floor(Math.random() * 206) + 50 : Math.floor(Math.random() * 127) + 1;

      const rowObj = {
        id: Date.now() + Math.random(),
        type: type,
        targetVal: targetVal,
        bits: type === '2to10' ? valToBits(targetVal) : [0,0,0,0,0,0,0,0],
        inputVal: ''
      };

      rowsData.unshift(rowObj);
      if (autoRender) renderRows();
    }

    function valToBits(val) {
      return BIT_VALS.map(v => (val & v) ? 1 : 0);
    }

    function renderRows() {
      rowContainer.innerHTML = '';
      rowsData.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = `game-row row-type-${row.type}`;

        const bitsWrapper = document.createElement('div');
        bitsWrapper.className = 'bits-wrapper';

        for (let i = 0; i < 8; i++) {
          const tile = document.createElement('div');
          tile.className = `bit-tile ${row.bits[i] === 1 ? 'active' : ''}`;
          tile.innerText = row.bits[i];

          // 局部更新優化：直接變更當前節點，不重繪全盤，大幅提升反應速度
          if (row.type === '10to2') {
            tile.onclick = () => {
              if (isPaused || isGameOver) return;
              row.bits[i] = row.bits[i] === 0 ? 1 : 0;
              
              tile.innerText = row.bits[i];
              if (row.bits[i] === 1) tile.classList.add('active');
              else tile.classList.remove('active');

              checkRow(row);
            };
          }
          bitsWrapper.appendChild(tile);
        }
        rowDiv.appendChild(bitsWrapper);

        const eq = document.createElement('div');
        eq.className = 'equal-sign';
        eq.innerText = '=';
        rowDiv.appendChild(eq);

        const valContainer = document.createElement('div');
        if (row.type === '10to2') {
          valContainer.className = 'val-box target-box';
          valContainer.innerText = row.targetVal;
        } else {
          valContainer.className = 'val-box';
          const input = document.createElement('input');
          input.className = 'val-input';
          input.type = 'number';
          input.value = row.inputVal;
          input.placeholder = '?';

          input.oninput = (e) => { if (!isPaused && !isGameOver) row.inputVal = e.target.value; };
          input.onkeydown = (e) => { if (e.key === 'Enter') checkRow(row); };
          valContainer.appendChild(input);
        }
        rowDiv.appendChild(valContainer);
        rowContainer.appendChild(rowDiv);
      });
    }

    function checkRow(row) {
      if (isPaused || isGameOver) return;

      let isCorrect = false;

      if (row.type === '10to2') {
        const currentSum = row.bits.reduce((sum, b, i) => sum + b * BIT_VALS[i], 0);
        if (currentSum === row.targetVal) isCorrect = true;
      } else {
        if (parseInt(row.inputVal) === row.targetVal) isCorrect = true;
      }

      if (isCorrect) {
        rowsData = rowsData.filter(r => r.id !== row.id);
        score += 100 * level;
        linesLeft--;

        if (rowsData.length === 0) triggerBoardClear();

        if (linesLeft <= 0) {
          level++;
          linesLeft = getTargetLines(level);
          resetInterval();
        }

        updateUI();
        renderRows();
      }
    }

    function triggerBoardClear() {
      score += 500;
      const banner = document.createElement('div');
      banner.className = 'board-clear-banner';
      banner.innerText = 'BOARD CLEAR! +500';
      rowContainer.appendChild(banner);
      
      setTimeout(() => {
        banner.remove();
        for (let i = 0; i < 3; i++) spawnRow(false);
        renderRows();
      }, 1000);
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseBtn.innerText = 'RESUME';
        pauseModal.classList.add('active');
      } else {
        pauseBtn.innerText = 'PAUSE';
        pauseModal.classList.remove('active');
      }
    }

    pauseBtn.onclick = () => togglePause();
    modalResumeBtn.onclick = () => togglePause();
    document.getElementById('end-btn').onclick = () => endGame();

    function endGame() {
      isGameOver = true;
      clearInterval(spawnTimer);
      pauseModal.classList.remove('active');
      document.getElementById('final-score').innerText = score;
      document.getElementById('final-level').innerText = level;
      gameoverModal.classList.add('active');
    }

    // 上傳成績至 Google 試算表
    document.getElementById('submit-btn').onclick = () => {
      const statusMsg = document.getElementById('status-msg');
      statusMsg.style.color = "yellow";
      statusMsg.innerText = "⏳ 正在上傳成績...";

      const formData = new URLSearchParams();
      formData.append('className', studentInfo.className);
      formData.append('seat', studentInfo.seat);
      formData.append('name', studentInfo.name);
      formData.append('score', score);
      formData.append('level', level);

      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      })
      .then(() => {
        statusMsg.style.color = "lightgreen";
        statusMsg.innerText = "✅ 成績已成功寫入試算表！";
      })
      .catch(() => {
        statusMsg.style.color = "#ff6b6b";
        statusMsg.innerText = "❌ 上傳失敗，請檢查網路連線。";
      });
    };

    // 觀看即時排行榜 (JSONP 繞過跨網域限制)
    document.getElementById('view-board-btn').onclick = () => {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '<tr><td colspan="4">載入排行榜中...</td></tr>';
      leaderboardModal.classList.add('active');

      window.handleLeaderboardData = function(data) {
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">目前尚無成績紀錄</td></tr>';
          return;
        }
        tbody.innerHTML = data.map((item, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td>${item.className}${item.seat} ${item.name}</td>
            <td>L${item.level}</td>
            <td><strong>${item.score}</strong></td>
          </tr>
        `).join('');
      };

      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${GAS_WEB_APP_URL}?callback=handleLeaderboardData&t=${Date.now()}`;
      document.body.appendChild(script);
    };

    document.getElementById('close-board-btn').onclick = () => leaderboardModal.classList.remove('active');
    document.getElementById('restart-btn').onclick = () => startGame();
  </script>
</body>
</html>
